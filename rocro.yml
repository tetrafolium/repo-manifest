inspecode:
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration-auto-label-plural -m ./default.xml
          - repo sync
        sharing: true
      commands:
        - ls -alt ./
        - cd sources/meta-openembedded && ls -alt
      reports:
        - path: ./report.json
      auto-label:
        - label: "deferred"
          if:
           - match:
              pattern: "*USELESS_CALL*"
              value: ${{issue.description}}
