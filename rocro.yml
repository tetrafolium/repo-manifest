inspecode:
  tasks:
    - name: child-repo
      type: shell
      commands:
        - sudo ls -alt ./
        - sudo cat ./report.sarif
      artifacts:
        - path: ./report.sarif
      reports:
        - path: ./report.sarif
    - git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration -m ./default.xml
        sharing: false
      name: git-repo-task
      type: shell
      commands:
          - export REPODIR=$(pwd)
          - echo $REPODIR
          - ls -alt $REPODIR
          - cd $REPODIR/ant
          - cov-build --dir ~/cov-im --parallel-translate=1 ant
