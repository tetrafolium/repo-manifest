inspecode:
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./repo.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration-tag -m ./default.xml
          - repo sync
        sharing: ture
      commands:
        - ls -alt ./
        - cd sources/meta-openembedded && ls -alt
      reports:
        - path: ./report.json
