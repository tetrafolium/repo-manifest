inspecode:
  tasks:
    - name: nanopb-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration-share -m ./default.xml
          - repo sync
        sharing: true
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
