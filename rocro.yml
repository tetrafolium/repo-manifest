inspecode:
  tasks:
    - name: child-repo
      type: shell
      commands:
        - sudo ls -alt ./
        - sudo cat ./report.sarif
      artifacts:
        - path: ./report.sarif
      reports:
        - path: ./report.sarif
    - git-repo:
        sharing: false
      name: git-repo-task
      type: shell
      commands:
        - echo "Git-repo setup"
