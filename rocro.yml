inspecode:
  coverity:
    options:
      --commands:
        - export REPODIR=$(pwd)
        - cd $REPODIR/ant
        - cov-build --dir ~/cov-im --parallel-translate=1 ant
        - cov-analyze --dir ~/cov-im
        - cov-format-errors --dir ~/cov-im --format sarif > $REPODIR/coverity.sarif
        - ls -alt $REPODIR
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration -m ./default.xml
          - repo sync
        sharing: true
      commands:
        main:
          - echo "Shell task processing"
          - ls -alt $REPODIR
      artifacts:
        - path: coverity.sarif
