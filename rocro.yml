inspecode:
  tasks:
    - name: metadata-test
      type: shell
      git-repo:
        manifest: ./default.xml
        sharing: true
      commands:
        - cat ./report.sarif
      reports:
        - path: ./report.sarif
    - name: auto-label-test
      type: shell
      git-repo:
        manifest: ./default.xml
        sharing: true
      commands:
        - cat ./report-auto-label.sarif
      reports:
        - path: ./report-auto-label.sarif
      auto-label:
        - label: "deferred"
          if:
            - match:
                pattern: "*[severity_override]critical*"
                value: ${{issue.description}}
                
        - label: "license"
          if:
            - match:
                pattern: "*[severity_override]critical*"
                value: ${{issue.description}}
