inspecode:
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        sharing: true
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json

    - name: nanopb-task
      type: shell
      git-repo:
        manifest: ./default2.xml
        sharing: true
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
