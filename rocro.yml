inspecode:
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up: []
        sharing: 
          without: sources/meta-openembedded/ant/**
      machine:
        type: local
        tags:
        - linux
        - amd64
        - gcp
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json

    - name: nanopb-task
      type: shell
      git-repo:
        manifest: ./default2.xml
        set-up: []
        sharing: true
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
