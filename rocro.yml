inspecode:
  coverity:
    options:
      --commands:
        - export REPODIR=$(pwd)
        - echo $REPODIR
        - ls -alt $REPODIR
        - cd $REPODIR/ant
        - cov-build --dir ~/cov-im --parallel-translate=1 ant
        - cov-analyze --dir ~/cov-im --all
        - cov-format-errors --dir ~/cov-im --sarif-output coverity-results.sarif

  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration -m ./default.xml
          - repo sync
        sharing: false
      commands:
        - echo "Start Coverity SARIF export"
        - cov-analyze --dir ~/cov-im --all
        - cov-format-errors --dir ~/cov-im --sarif-output coverity-results.sarif
        - ls -alt .
      artifacts:
        - path: coverity-results.sarif
