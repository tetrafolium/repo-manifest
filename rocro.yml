inspecode:
  tasks:
    - name: repo
      type: shell
      commands:
        - sudo repo init -u https://github.com/tetrafolium/repo-manifest.git -b issues-5528-Virtual-Branch-Add-yaml-Coverity
        - sudo repo sync
        - sudo sed -i 's|/home/rocro/src/github.com/tetrafolium/meta-openembedded/|sources/meta-openembedded/|g' sources/meta-openembedded/artifacts_report.json
        - sudo cp sources/meta-openembedded/artifacts_report.json ./artifacts_report.json
        - sudo ls -alt ./
        - sudo cat ./artifacts_report.json
      artifacts:
        - path: ./artifacts_report.json
      reports:
        - path: ./artifacts_report.json
