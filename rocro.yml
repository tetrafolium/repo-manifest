inspecode:
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration-demo -m ./default.xml
          - repo sync
        sharing:
          without: sources/meta-openembedded/ant/*
      commands:
        - ls -alt ./
        - cd sources/meta-openembedded && ls -alt
      reports:
        - path: ./report.json
