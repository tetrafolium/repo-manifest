inspecode:
  coverity:
    options:
      --commands:
        - export REPODIR=$(pwd)
        - echo $REPODIR
        - ls -alt $REPODIR
        - cd $REPODIR/ant
        - cov-build --dir ~/cov-im --parallel-translate=1 ant
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration -m ./default.xml
          - repo sync
        sharing: false
      commands:
        - ls -alt ./
