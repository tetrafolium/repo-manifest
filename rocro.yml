inspecode:
  tasks:
    - name: child-repo
      type: shell
      commands:
        - sudo ls -alt ./
        - sudo cat ./report.sarif
      artifacts:
        - path: ./report.sarif
      reports:
        - path: ./report.sarif
    - git-repo:
        set-up:
          - repo init -u ./ -b git-repo-task-configuration -m ./default.xml
          - repo sync
          - ls -a
      name: git-repo-task
      type: shell
