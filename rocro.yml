inspecode:
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration-tag-share-without -m default.xml && repo sync
        sharing: 
          without: sources/meta-openembedded/ant/*
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json

    - name: nanopb-task
      type: shell
      git-repo:
        manifest: ./default2.xml
        set-up: []
        sharing: 
          without: sources/meta-openembedded/ant/*
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
