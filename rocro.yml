inspecode:
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up: []
        sharing: 
          without: sources/meta-openembedded/ant/**
      machine:
        type: local
        tags:
        - rocro-linux-7
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
