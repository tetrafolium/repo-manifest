inspecode:
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        sharing: true
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
      auto-label:
        - label: "deferred"
          if:
            - match:
                pattern: "*USELESS_CALL*"
                value: ${{issue.description}}

        - label: "duplicate"
          if:
            - match:
                pattern: "*USELESS_CALL*"
                value: ${{issue.description}}

        - label: "license"
          if:
            - match:
                pattern: "*FORWARD_NULL*"
                value: ${{issue.description}}

        - label: "bug"
          if:
            - match:
                pattern: "*FORWARD_NULL*"
                value: ${{issue.description}}

        - label: "license"
          if:
            - match:
                pattern: "*FORWARD_NULL*"
                value: ${{issue.description}}
