inspecode:
  tools:
    coverity:
      options:
        --commands:
        - repo init -u https://github.com/tetrafolium/repo-manifest.git -b issues-5528-Virtual-Branch-Add-yaml
        - repo sync
        - export REPODIR=$(pwd)
        - echo $REPODIR
        - ls -alt $REPODIR
        - cd $REPODIR/sources/meta-openembedded/ant
        - cov-build --dir ~/cov-im --parallel-translate=1 ant
    fortify:
      options:
        --commands:
        - sourceanalyzer -b build_id ant clean compile-partial
        --work-dir: .
