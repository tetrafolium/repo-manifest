inspecode:
  tasks:
    - name: repo
      type: shell
      commands:
        - repo init -u https://github.com/tetrafolium/repo-manifest.git -b issues-5528-Virtual-Branch-Add-yaml
        - repo sync
        - ls -a sources/meta-openembedded
        - sed -i 's|\.\./meta-openembedded/|sources/meta-openembedded/|g' sources/meta-openembedded/artifacts_report.json
      artifacts:
        - path: sources/meta-openembedded/artifacts_report.json
      reports:
        - path: sources/meta-openembedded/artifacts_report.json
