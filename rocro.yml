inspecode:
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration-tag-add-shell -m ./default.xml
          - repo sync
        sharing: true
      commands:
        - ls -alt ./
      reports:
        - path: ./report2.json

    - name: nanopb-task
      type: shell
      git-repo:
        manifest: ./default2.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration-tag-add-shell -m ./default2.xml
          - repo sync
        sharing: true
      commands:
        - ls -alt ./
      reports:
        - path: ./report2.json

    - name: parent-issues
      type: shell
      commands:
        main:
          - echo "hello"
          - cat ./report.json
      artifacts:
        - path: ./report.json
      reports:
        - path: ./report.json
