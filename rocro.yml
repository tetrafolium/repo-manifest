inspecode:
  coverity:
    options:
      --commands:
        - export REPODIR=$(pwd)
        - cd $REPODIR/ant
        - cov-build --dir ~/cov-im --parallel-translate=1 ant
        - cov-analyze --dir ~/cov-im

  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration -m ./default.xml
          - repo sync
        sharing: true
      artifacts:
        downloads:
          - source:
              task: Coverity
              path: artifacts/report_2.sarif
            destination:
              path: ./artifacts/report_2.sarif
      commands:
        main:
          - echo "Shell task processing"
          - ls -alt $REPODIR
          - cat ./coverity.sarif
      reports:
        - ./artifacts/report_2.sarif
