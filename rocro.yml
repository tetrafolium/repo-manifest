inspecode:
  tasks:
    - name: code-analysis
      type: shell
      git-submodules:
        set-up:
          - git submodule update --init --recursive
        sharing: true
      commands:
        - Write-Output "--- Working directory ---"
        - Get-Location
        - Write-Output "--- Submodule status ---"
        - git submodule status
        - Write-Output "--- Listing submodule contents ---"
        - Get-ChildItem -Path meta-openembedded -ErrorAction SilentlyContinue | Select-Object -First 5 Name
        - Get-ChildItem -Path nanopb -ErrorAction SilentlyContinue | Select-Object -First 5 Name
        - Write-Output "--- Coverity report ---"
        - Get-Content ./coverity-results.json
      machine:
        type: local
        tags:
          - windows
          - windows1
      reports:
        - path: ./coverity-results.json
