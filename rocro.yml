inspecode:
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration-tag -m ./default.xml
          - repo sync
        sharing: true
      commands:
        - ls -alt ./
        - cd sources/meta-openembedded && ls -alt
      reports:
        - path: ./report.json
      auto-label:
        - label: bug
          description: |
            Function allocates memory
            but never frees it
