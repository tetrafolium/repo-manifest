inspecode:
  tasks:
    - name: git-repo-task-meta-openembedded
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration-demo -m ./default.xml
          - repo sync
        sharing: true
      commands:
        - ls -alt ./
        - cd sources/meta-openembedded && ls -alt
      artifacts:
        - path: ./report.json
      reports:
        - path: ./report.json

    - name: git-repo-task-nanopb
      type: shell
      git-repo:
        manifest: ./default.xml
        set-up:
          - repo init -u ./ -b git-repo-task-configuration-demo -m ./default.xml
          - repo sync
        sharing: true
      commands:
        - ls -alt ./
        - cd sources/meta-openembedded && ls -alt
      artifacts:
        - path: ./report.json
      reports:
        - path: ./report.json
