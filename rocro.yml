inspecode:
  tasks:
    - name: code-analysis
      type: shell
      git-submodules:
        set-up:
          - git submodule update --init --recursive
        sharing: true
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
      auto-label:
        - label: "deferred"
          if:
           - match:
              pattern: "*USELESS_CALL*"
              value: ${{issue.description}}
