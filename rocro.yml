inspecode:
  tasks:
    - name: git-repo-task
      type: shell
      git-repo:
        manifest: ./default.xml
        sharing: true
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
      auto-label:
        - label: "deferred"
          if:
           - match:
              pattern: "*USELESS_CALL*"
              value: ${{issue.description}}
