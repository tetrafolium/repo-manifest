inspecode:
  tasks:
    - name: git-repo-all-default
      type: shell
      git-repo: {}
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
    - name: git-repo-sharing-on
      type: shell
      git-repo:
        sharing: true
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
    - name: git-repo-sharing-off
      type: shell
      git-repo:
        sharing: false
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
    - name: git-repo-without
      type: shell
      git-repo:
        sharing:
          without: sources/meta-openembedded/ant/
      commands:
        - ls -alt ./
      reports:
        - path: ./report.json
